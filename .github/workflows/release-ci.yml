name: Release CI

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Read commit subject
        id: commit
        run: echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: graalvm
          java-version: 25

      - name: Run tests
        if: "!contains(steps.commit.outputs.subject, '[ci skip]')"
        run: ./gradlew test

      - name: Build
        if: "!contains(steps.commit.outputs.subject, '[ci skip]')"
        run: ./gradlew build

      - name: Get version
        run: |
          VERSION=$(grep '^version' build.gradle.kts | sed -E 's/.*"(.+)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Compute build number
        run: |
          git fetch --tags
          LAST=$(git tag -l "v${VERSION}-build-*" | sort -V | tail -n1)
          if [[ $LAST =~ -build-([0-9]+)$ ]]; then
            NEXT=$((BASH_REMATCH[1]+1))
          else
            NEXT=1
          fi
          echo "BUILD_NUMBER=$NEXT" >> $GITHUB_ENV

      - name: Create tag
        if: "!contains(steps.commit.outputs.subject, '[release skip]')"
        run: |
          TAG="v${VERSION}-build-${BUILD_NUMBER}"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag "$TAG"
          git push origin "$TAG"

      - name: Release
        if: "!contains(steps.commit.outputs.subject, '[release skip]')"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}-build-${{ env.BUILD_NUMBER }}
          files: build/libs/*.jar
